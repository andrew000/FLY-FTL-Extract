[project]
name = "fly-ftl-extract"
version = "0.1.0"
description = "Drop-in replacement for ftl-extract where a simulated Drosophila mushroom body decides what is a Fluent key"
readme = "README.md"
license = "MIT"
requires-python = ">=3.14,<3.15"
dependencies = [
    "numpy>=2.3",
    "scipy>=1.16",
    "rich>=14",
    "click>=8.2",
    "fluent-syntax>=0.19.0",
]

[project.optional-dependencies]
connectome = [
    "pyarrow>=21",
    "pandas>=2.3",
]

[project.scripts]
ftl = "fly_ftl_extract.cli:run"
fly-ftl = "fly_ftl_extract.cli:run"

[dependency-groups]
dev = [
    "pytest>=8.4",
    "ruff>=0.13",
    "mypy>=1.18",
    "scipy-stubs>=1.18.1.0",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["fly_ftl_extract"]
# Trained brain + connectome ship inside the wheel (Phase 7 check). `artifacts` also
# survives VCS-ignore rules; the generated dataset is explicitly kept out.
artifacts = ["fly_ftl_extract/data/*.npz", "fly_ftl_extract/data/meta.json"]
exclude = ["fly_ftl_extract/data/dataset/"]

[tool.ruff]
target-version = "py314"
line-length = 100
extend-exclude = ["tests/fixtures", "tests/golden", ".cache"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "COM812", # trailing comma — conflicts with formatter
    "ISC001", # implicit str concat — conflicts with formatter
    "D203",   # one-blank-line-before-class — conflicts with D211
    "D213",   # multi-line-summary-second-line — conflicts with D212
    "D100",   # module docstrings not required everywhere
    "D104",   # package docstrings not required
    "D107",   # __init__ docstrings
    "FIX002", # TODO comments are allowed
    "TD002", "TD003",
    "PLR0913", # many-args functions are fine for CLI options
    "CPY001",  # no copyright headers
    "TRY003", "EM101", "EM102",  # exception messages are built inline (they mirror the original texts)
    "PTH",    # os.path is deliberate: the original prints paths exactly as it joined them
    "C901", "PLR0911", "PLR0912", "PLR0915",  # ports of the original's functions keep their shape
    "D105",   # magic methods need no docstrings
    "TC001", "TC002", "TC003",  # runtime imports are fine; TYPE_CHECKING blocks hurt readability
    "ANN401", # Any is needed for tomllib payloads
    "RUF001", "RUF002", "RUF003",  # Ukrainian/typographic characters in docstrings and comments
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "D", "PLR2004", "INP001", "S603", "S607", "SLF001"]
"scripts/**" = ["T201", "INP001", "S603", "S607", "D", "E501", "PD010", "S101"]
"fly_ftl_extract/cli/__init__.py" = ["FBT001"]  # click passes flags positionally

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
python_version = "3.14"
strict = true
warn_unreachable = true
packages = ["fly_ftl_extract"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["fixtures", "golden"]
addopts = "-ra"
