name: Release

# How a release goes out:
#
#   1. Bump `version` in pyproject.toml on `master`, then push the version tag:
#        git tag vX.Y.Z master && git push origin vX.Y.Z
#      The tag push builds the wheel and the sdist and attaches them to the GitHub
#      release for that tag. A draft release is created if there is none; a draft you
#      already saved in the UI for that tag name is used as is.
#   2. Edit the draft's title and notes, look the assets over, then publish it. Publishing
#      downloads exactly those assets from the release and uploads them to PyPI. Nothing
#      is rebuilt, so what was inspected is what ships.
#
# GitHub does not run workflows for saving, editing or deleting a *draft* release, so a
# draft alone never starts a build: push the tag, or run the workflow manually from the
# Actions tab (pick the branch or tag to build from, name the release tag). The manual
# run also rebuilds and replaces the assets after a fix.
#
# Publishing a release whose tag was never pushed and never built fails in the publish
# job on purpose: it finds no assets. Build them (tag push or manual run) and re-run the
# publish job.

on:
  push:
    tags: [ "v*" ]
  release:
    types: [ published ]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag of the release to attach the artifacts to, e.g. v0.1.0"
        required: true
        type: string

jobs:
  draft:
    name: 📝 Ensure a draft release exists
    if: github.event_name != 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      # One job creates the draft so the build job never has to. `gh release view` also
      # finds drafts by tag name.
      - name: Create the draft if there is no release for the tag yet
        shell: bash
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG exists; the build jobs will attach to it."
          else
            gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft --verify-tag \
              --title "$RELEASE_TAG" --notes "Draft created by the Release workflow. Edit the title and notes before publishing."
          fi

  build:
    name: 📦 Build wheels
    needs: draft
    runs-on: ubuntu-latest
    permissions:
      contents: write  # attaching the assets to the release
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      # Builds the pushed tag, or the ref a manual run was started on.
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.14"
          version: "latest"
          activate-environment: "true"

      - name: Prepare the project
        shell: bash
        run: uv sync --group dev

      # The tag names the release, pyproject.toml names the package; they must agree,
      # otherwise release vX.Y.Z would ship a wheel of another version.
      - name: Check that the tag matches the project version
        shell: bash
        run: |
          version="$(uv version --short)"
          if [ "$version" != "${RELEASE_TAG#v}" ]; then
            echo "::error::pyproject.toml says version $version but the release tag is $RELEASE_TAG. Bump the version or fix the tag."
            exit 1
          fi

      # Pure Python: one build gives the py3-none-any wheel and the sdist.
      - name: Build the wheel and the sdist
        shell: bash
        run: uv build --out-dir wheelhouse

      - name: Check the distributions
        shell: bash
        run: uv run --with twine --with "readme-renderer[md]" twine check wheelhouse/*

      # The wheel in an environment without the project: the connectome and the trained
      # weights must be inside it, and the fly must agree with the ast reference.
      - name: Smoke-test the wheel
        shell: bash
        run: |
          uv run --no-project --with wheelhouse/*.whl -- ftl --version
          uv run --no-project --with wheelhouse/*.whl -- ftl extract tests/fixtures/projects/basic/app /tmp/out -l en --fly-audit --fly-no-tui 2>&1 | tee smoke.log
          grep -F "Audit: 0 differences" smoke.log

      # The wheel above is built from the source tree. Building one from the sdist is the
      # only thing that proves the sdist itself is complete (the connectome, the weights
      # and the metadata are in it), which is what source installs from PyPI rely on. The
      # two wheels must hold the same files.
      - name: Build a wheel from the sdist
        shell: bash
        run: |
          uv build --wheel --out-dir sdist-check wheelhouse/*.tar.gz
          diff <(unzip -Z1 wheelhouse/*.whl | sort) <(unzip -Z1 sdist-check/*.whl | sort)

      # `--clobber` lets a manual re-run replace assets of the same name.
      - name: Attach the artifacts to the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -lah wheelhouse
          gh release upload "$RELEASE_TAG" wheelhouse/* --repo "$GITHUB_REPOSITORY" --clobber

  publish:
    name: 🐍 Publish distribution 📦
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write  # IMPORTANT: this permission is mandatory for trusted publishing
    steps:
      - name: Download the assets attached to the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          if ! gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir dist --pattern '*.whl' --pattern '*.tar.gz'; then
            echo "::error::No wheels are attached to $RELEASE_TAG. Push the tag or run the Release workflow manually so the build job attaches them, then re-run this job."
            exit 1
          fi
          ls -lah dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
